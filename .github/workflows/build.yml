name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .cache/android-sdk
            .cache/gradle-dist
            .cache/gradle-home
          key: android-sdk-gradle-${{ hashFiles('Makefile', 'gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-gradle-

      - name: Cache Gradle wrapper jar
        uses: actions/cache@v4
        with:
          path: gradle/wrapper/gradle-wrapper.jar
          key: gradle-wrapper-${{ hashFiles('Makefile') }}

      - name: Setup toolchain
        run: make setup

      - name: Build debug APK
        run: make build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketd-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
